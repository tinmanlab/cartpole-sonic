name: native-sonic-core

on:
  pull_request:
    paths:
      - 'native/**'
      - 'evidence/native_core_smoke.json'
      - '.github/workflows/native-core.yml'
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'evidence/native_core_smoke.json'
      - '.github/workflows/native-core.yml'

permissions:
  contents: read

jobs:
  core-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SONIC_UPSTREAM: ${{ github.workspace }}/.upstream-sonic
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NVlabs/GR00T-WholeBodyControl
          ref: b042411fae38ee4d1af9aac82a37a1f8d14d6dd0
          path: .upstream-sonic
          persist-credentials: false
          sparse-checkout: |
            gear_sonic/trl/modules
            gear_sonic/trl/utils
            gear_sonic/config/actor_critic
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: native/requirements.lock
      - name: Install bounded CPU-only dependencies
        run: |
          python -m pip install 'torch==2.7.0+cpu' 'torchvision==0.22.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r native/requirements.lock
          python -m pip check
      - name: Native computation and source-provenance tests
        run: python -m pytest native/test_core_smoke.py -q --junitxml=native-results.xml
      - name: Record fresh execution, not a stored PASS
        run: python native/core_smoke.py --output native-core-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sonic-core-evidence
          path: |
            native-core-result.json
            native-results.xml
          if-no-files-found: error
