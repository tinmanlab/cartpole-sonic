name: native-sonic

on:
  pull_request:
    paths:
      - 'native/**'
      - 'control_contract.js'
      - 'mujoco_sim.js'
      - 'sonic_toy.js'
      - 'temporal_control_lab.js'
      - 'scripts/export_runtime_fixture.mjs'
      - 'evidence/native_core_smoke.json'
      - 'evidence/native_training.json'
      - 'evidence/native_learning/**'
      - 'evidence/native_concepts/**'
      - 'evidence/temporal_audit/**'
      - 'evidence/matched_cues/**'
      - 'evidence/guided_lesson/**'
      - '.github/workflows/native-core.yml'
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'control_contract.js'
      - 'mujoco_sim.js'
      - 'sonic_toy.js'
      - 'temporal_control_lab.js'
      - 'scripts/export_runtime_fixture.mjs'
      - 'evidence/native_core_smoke.json'
      - 'evidence/native_training.json'
      - 'evidence/native_learning/**'
      - 'evidence/native_concepts/**'
      - 'evidence/temporal_audit/**'
      - 'evidence/matched_cues/**'
      - 'evidence/guided_lesson/**'
      - '.github/workflows/native-core.yml'

permissions:
  contents: read

jobs:
  native-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SONIC_UPSTREAM: ${{ github.workspace }}/.upstream-sonic
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      WANDB_MODE: disabled
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: NVlabs/GR00T-WholeBodyControl
          ref: b042411fae38ee4d1af9aac82a37a1f8d14d6dd0
          path: .upstream-sonic
          persist-credentials: false
          sparse-checkout: |
            gear_sonic/trl/modules
            gear_sonic/trl/utils
            gear_sonic/trl/trainer
            gear_sonic/trl/callbacks
            gear_sonic/utils
            gear_sonic/config/actor_critic
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: native/training.lock
      - name: Install CPU-only training environment
        run: |
          python -m pip install 'torch==2.7.0+cpu' 'torchvision==0.22.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r native/training.lock
          python -m pip check
      - name: Native contracts, committed replay and WASM/native physics parity
        run: python -m pytest native/test_core_smoke.py native/test_training.py native/test_learning.py native/test_concepts.py native/test_concept_control.py native/test_encoder_transfer.py native/test_temporal_pairs.py native/test_temporal_audit.py native/test_matched_cues.py native/test_runtime_parity.py native/test_guided_lesson.py -q --junitxml=native-results.xml
      - name: Record fresh module and trainer executions
        run: |
          python native/core_smoke.py --output native-core-result.json
          python native/training.py --output-dir training-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sonic-evidence
          path: |
            native-core-result.json
            native-results.xml
            training-run/native_training.json
            training-run/native-weights.pt
          if-no-files-found: error
